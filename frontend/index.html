<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Antarman — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/auth.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <h1>Antarman</h1>
      <p>Find Your Flow. Own Your Time.</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <div id="error-msg" class="error-msg" hidden></div>

    <!-- LOGIN -->
    <form id="login-form" class="auth-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="l-email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="l-password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Login</button>
    </form>

    <!-- REGISTER -->
    <form id="register-form" class="auth-form" hidden>
      <div class="field">
        <label>Username</label>
        <input type="text" id="r-username" placeholder="yourname" required/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="r-email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="r-password" placeholder="••••••••" required/>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="r-confirm" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
    </form>
  </div>
  <footer>Team Gear — Pranay Tanpure (Lead) &amp; Vipin Rathod · Tushar Supekar · Kartik Rokade · Virdhaval Sawant</footer>
</div>
<script src="js/auth.js"></script>
</body>
</html>
